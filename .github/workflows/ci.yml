name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/DsAgentChat_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/DsAgentChat_web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run type-check
      - run: npm run build
  markdown-chunking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install loguru==0.7.3
      - run: python -m unittest discover -s tests -v
      - run: python scripts/chunk_mineru.py examples/mineru-demo --output data/demo-chunks.json
